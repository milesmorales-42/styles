<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Choisissez le style de votre site</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Anton&family=Archivo:wght@400;700&family=Bangers&family=Bowlby+One&family=Bricolage+Grotesque:wght@400;800&family=Bungee&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;600&family=DM+Serif+Display&family=Fraunces:wght@600;800&family=Fredoka:wght@400;600&family=Gloock&family=Instrument+Serif&family=Jost:wght@400;500&family=Karla:wght@400;700&family=Lato:wght@400;700&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@500;700&family=Nunito:wght@400;700&family=Nunito+Sans:wght@400;700&family=Outfit:wght@400;500;600&family=Righteous&family=Rubik:wght@400;600;800&family=Shippori+Mincho:wght@500;700&family=Sora:wght@400;700&family=Space+Grotesk:wght@400;600&family=Syne:wght@500;800&family=Unbounded:wght@600;800&family=Work+Sans:wght@400;600&family=Young+Serif&family=Zen+Kaku+Gothic+New:wght@400;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Bodoni+Moda:ital,wght@0,500;1,500&family=Cinzel:wght@500&family=EB+Garamond:ital,wght@0,400;1,400&family=Italiana&family=Tenor+Sans&family=Libre+Caslon+Text:ital@0;1&family=Marcellus&family=Lora:ital,wght@0,400;1,400&display=swap">
<style>
:root{
  --cbg:#f2f3f5;--cfg:#1a1d22;--cmut:#5d646e;--ccard:#ffffff;--cln:#e0e3e8;--cac:#1a1d22;--con:#ffffff;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--cbg:#131518;--cfg:#eceef1;--cmut:#9aa1ab;--ccard:#1d2024;--cln:#2c3036;--cac:#eceef1;--con:#131518;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cbg);color:var(--cfg);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #4c8dff;outline-offset:2px}

/* ---------- galerie ---------- */
.gh{max-width:1180px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 18px 8px}
.brand{font-weight:600;font-size:15px;color:var(--cmut)}
.gh h1{font-size:clamp(28px,6.5vw,44px);line-height:1.08;margin:6px 0 10px;font-weight:600;letter-spacing:-.015em}
.gh p{margin:0;color:var(--cmut);font-size:16px;max-width:52ch;line-height:1.45}
.bar{max-width:1180px;margin:0 auto;padding:16px 18px 6px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--ccard);border:1px solid var(--cln);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:500;font-size:15px;cursor:pointer;color:var(--cmut)}
.seg button[aria-pressed="true"]{background:var(--cac);color:var(--con)}
.picked{display:none;align-items:center;gap:10px;background:var(--ccard);border:1px solid var(--cln);border-radius:999px;padding:5px 6px 5px 14px;font-size:15px}
.picked.on{display:inline-flex}
.picked b{font-weight:600}
.picked button{border:0;background:var(--cac);color:var(--con);border-radius:999px;padding:7px 14px;font-weight:500;cursor:pointer}
.grid{max-width:1180px;margin:0 auto;padding:10px 18px calc(40px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}}
@media (min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--ccard);border:1px solid var(--cln);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card.chosen{border-color:var(--cac);box-shadow:0 0 0 2px var(--cac)}
.th{position:relative;aspect-ratio:390/560;overflow:hidden;cursor:pointer;background:#ddd}
.th .ti{width:390px;transform-origin:0 0;pointer-events:none;position:absolute;top:0;left:0}
.th .badge{position:absolute;left:8px;top:8px;background:var(--cac);color:var(--con);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.cf{display:flex;align-items:flex-start;gap:6px;padding:10px 8px 12px 12px}
.cf div{flex:1;min-width:0}
.cf b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.cf span{display:block;color:var(--cmut);font-size:13px;line-height:1.3;margin-top:3px}
.heart{border:0;background:none;width:40px;height:40px;flex:none;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.heart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.heart[aria-pressed="true"] svg{fill:#e5484d;stroke:#e5484d}
.empty{grid-column:1/-1;text-align:center;color:var(--cmut);padding:50px 16px;font-size:16px;line-height:1.5}

/* ---------- aperçu plein écran ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--cbg);display:none;flex-direction:column}
.ov.on{display:flex}
.ov:focus{outline:none}
.ot{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;background:var(--ccard);border-bottom:1px solid var(--cln)}
.ot .back{border:0;background:none;display:flex;align-items:center;gap:4px;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px}
.ot .back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2}
.ot .tt{flex:1;min-width:0;text-align:center}
.ot .tt b{display:block;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ot .tt span{font-size:12.5px;color:var(--cmut)}
.ob{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.ofoot{background:var(--ccard);border-top:1px solid var(--cln);padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px))}
.ofoot p{margin:0 0 8px;text-align:center;font-size:12.5px;color:var(--cmut)}
.orow{display:flex;gap:8px}
.orow .nv{border:1px solid var(--cln);background:var(--cbg);width:50px;height:48px;border-radius:12px;cursor:pointer;display:grid;place-items:center;flex:none}
.orow .nv svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2}
.orow .pick{flex:1;border:0;background:var(--cac);color:var(--con);border-radius:12px;font-weight:600;font-size:16px;cursor:pointer;min-height:48px}
.orow .pick.done{background:#1f8a4c;color:#fff}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--cac);color:var(--con);padding:10px 16px;border-radius:999px;font-weight:500;font-size:15px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}

/* ---------- sites (base) ---------- */
.site{background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:16px;line-height:1.55;min-height:100%;position:relative;overflow-x:hidden;color-scheme:normal}
.site *{box-sizing:border-box}
.site h1,.site h2,.site h3{font-family:var(--fd);margin:0;line-height:1.05;font-weight:var(--fw)}
.site p{margin:0}
.site a{color:inherit;text-decoration:none}
.site .w{max-width:980px;margin:0 auto;padding:0 22px}
.site .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:var(--r);font-weight:600;font-size:15px;font-family:var(--fb);white-space:nowrap}
.site .sm{min-height:38px;padding:0 14px;font-size:14px}
.site .b1{background:var(--ac);color:var(--on)}
.site .b2{box-shadow:inset 0 0 0 2px var(--fg)}
.site .mut{color:var(--mut)}
.site .em{display:grid;place-items:center;line-height:1}
.site .p{color:var(--pc);font-weight:700}

/* L1 : grande accroche centrée */
.L1 .nav{display:flex;justify-content:space-between;align-items:center;padding:18px 22px}
.L1 .logo{font-family:var(--fd);font-size:22px;font-weight:var(--fw)}
.L1 .hero{text-align:center;padding:30px 22px 56px}
.L1 .hero .em{width:150px;height:150px;margin:0 auto 24px;border-radius:50%;background:var(--ac2);font-size:76px}
.L1 .hero h1{font-size:clamp(56px,15vw,112px);letter-spacing:-.02em}
.L1 .hero p{font-size:18px;margin:14px auto 26px;max-width:30ch;color:var(--mut)}
.L1 .cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.L1 .sec{padding:40px 0 48px}
.L1 h2{font-size:40px}
.L1 h3{font-size:21px;margin:28px 0 12px}
.L1 .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.L1 .card2{background:var(--sf);color:var(--sfg);border-radius:var(--r);overflow:hidden}
.L1 .card2 .em{height:108px;font-size:52px;background:var(--ac2)}
.L1 .card2 .t{padding:12px 12px 14px}
.L1 .card2 b{display:block;font-size:15px;line-height:1.25}
.L1 .card2 small{display:block;color:var(--mut);font-size:13px;margin:5px 0 8px;line-height:1.35}
.L1 .info{background:var(--sf);color:var(--sfg);padding:34px 0}
.L1 .info .w{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.L1 .info b{display:block;font-family:var(--fd);font-size:19px;margin-bottom:4px;font-weight:var(--fw)}
.L1 footer{padding:26px 22px 34px;text-align:center;font-size:13px;color:var(--mut)}

/* L2 : accroche à gauche, carte en liste */
.L2 .top{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--ln)}
.L2 .logo{font-family:var(--fd);font-size:25px;font-weight:var(--fw)}
.L2 .top a{font-weight:600;font-size:14px}
.L2 .hero{display:grid;gap:30px;padding:40px 22px 46px;align-items:center;max-width:980px;margin:0 auto}
@media (min-width:760px){.L2 .hero{grid-template-columns:1.1fr .9fr}}
.L2 .hero h1{font-size:clamp(42px,11.5vw,78px);letter-spacing:-.025em}
.L2 .hero p{font-size:17px;margin:16px 0 24px;max-width:34ch;color:var(--mut)}
.L2 .hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.L2 .blob{aspect-ratio:1;max-width:360px;width:100%;justify-self:center;border-radius:46% 54% 42% 58%/55% 45% 55% 45%;background:var(--ac);display:grid;place-items:center;font-size:110px;position:relative}
.L2 .blob i{position:absolute;font-style:normal;font-size:58px}
.L2 .blob i:nth-child(1){top:6%;right:4%}
.L2 .blob i:nth-child(2){bottom:8%;left:2%}
.L2 .menu{padding:10px 22px 40px;max-width:980px;margin:0 auto}
.L2 .menu h2{font-size:36px}
.L2 .cat{font-family:var(--fd);font-size:21px;color:var(--ac);margin:26px 0 4px;font-weight:var(--fw)}
.L2 .row{padding:13px 0;border-bottom:1px dashed var(--ln)}
.L2 .row .l{display:flex;align-items:baseline;gap:8px}
.L2 .row .l b{font-size:17px;line-height:1.25}
.L2 .row .l i{flex:1;border-bottom:2px dotted var(--ln);transform:translateY(-4px);min-width:16px}
.L2 .row small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.L2 .visit{display:grid;gap:18px;padding:30px 22px 44px;max-width:980px;margin:0 auto}
@media (min-width:760px){.L2 .visit{grid-template-columns:1fr 1fr}}
.L2 .map{height:190px;border-radius:var(--r);background-color:var(--sf);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--ln) 27px 29px),repeating-linear-gradient(90deg,transparent 0 41px,var(--ln) 41px 43px);display:grid;place-items:center;font-size:44px}
.L2 .visit h2{font-size:30px;margin-bottom:10px}
.L2 .visit p{margin-bottom:8px}

/* L3 : affiche street food */
.L3 .strip{background:var(--fg);color:var(--bg);font-family:var(--fd);white-space:nowrap;overflow:hidden;padding:9px 0;font-size:18px;letter-spacing:.02em}
.L3 .hero{padding:24px 22px 34px;position:relative}
.L3 .hero h1{font-size:clamp(74px,22vw,200px);line-height:.86;text-transform:uppercase;overflow-wrap:anywhere}
.L3 .stk{flex:none;letter-spacing:0;width:108px;height:108px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;text-align:center;font-family:var(--fd);font-size:18px;line-height:1.05;transform:rotate(12deg);padding:12px;border:3px solid var(--fg)}
.L3 .emr{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:50px;margin:18px 0 6px;letter-spacing:4px}
.L3 .hero p{font-size:20px;font-weight:700;margin:6px 0 20px}
.L3 .cta{display:flex;gap:12px;flex-wrap:wrap}
.L3 .btn{border:3px solid var(--fg);box-shadow:4px 4px 0 var(--fg)}
.L3 .b2{box-shadow:4px 4px 0 var(--fg);background:var(--sf);color:var(--sfg)}
.L3 .menu{padding:16px 22px 30px}
.L3 h2{font-size:58px;text-transform:uppercase;line-height:.9;margin-bottom:8px}
.L3 h3{font-size:26px;text-transform:uppercase;margin:22px 0 4px}
.L3 .blk{border:3px solid var(--fg);border-radius:var(--r);padding:12px;margin:12px 0;display:flex;gap:12px;align-items:center;background:var(--sf);color:var(--sfg)}
.L3 .blk .em{font-size:38px;width:62px;height:62px;flex:none;background:var(--ac2);border-radius:calc(var(--r) * .6)}
.L3 .blk b{display:block;font-size:16px;line-height:1.2}
.L3 .blk small{display:block;font-size:13px;line-height:1.3;opacity:.75;margin-top:2px}
.L3 .blk .px{margin-left:auto;font-family:var(--fd);font-size:20px;background:var(--ac);color:var(--on);padding:4px 10px;border-radius:999px;transform:rotate(-4deg);white-space:nowrap;flex:none}
.L3 .inf{padding:10px 22px 30px}
.L3 .big{font-family:var(--fd);font-size:30px;line-height:1.05;text-transform:uppercase;margin:6px 0}
.L3 .big + p{margin-bottom:14px}
.L3 .call{display:block;background:var(--ac);color:var(--on);text-align:center;font-family:var(--fd);font-size:28px;padding:22px 16px;text-transform:uppercase;border-top:3px solid var(--fg)}
.site.dots{background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:12px 12px}
.site.glow h1,.site.glow h2{text-shadow:0 0 18px var(--ac),0 0 4px var(--ac)}

/* L4 : épuré, style japonais */
.L4 .top{display:flex;justify-content:space-between;padding:22px 28px;font-size:14px;color:var(--mut)}
.L4 .top b{color:var(--fg);font-family:var(--fd);font-weight:var(--fw);font-size:17px}
.L4 .hero{padding:64px 28px 76px;position:relative;max-width:980px;margin:0 auto}
.L4 .hero::before{content:"";position:absolute;left:28px;top:0;height:44px;width:1px;background:var(--fg)}
.L4 .seal{width:58px;height:58px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-size:28px;margin-bottom:26px}
.L4 .hero small{display:block;color:var(--mut);margin-bottom:14px;font-size:15px}
.L4 .hero h1{font-size:clamp(56px,16vw,108px);letter-spacing:.05em}
.L4 .hero p{margin:18px 0 32px;max-width:28ch;color:var(--mut)}
.L4 .btn{border-radius:var(--r)}
.L4 .b2{box-shadow:inset 0 0 0 1px var(--fg);font-weight:500}
.L4 .b1{font-weight:500}
.L4 .cta{display:flex;gap:10px;flex-wrap:wrap}
.L4 .menu{padding:20px 28px 50px;max-width:980px;margin:0 auto}
.L4 h2{font-size:32px;margin-bottom:10px}
.L4 h3{font-size:15px;color:var(--ac);margin:30px 0 6px;font-family:var(--fb);font-weight:600}
.L4 .it{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:15px 0;border-top:1px solid var(--ln)}
.L4 .it b{font-weight:500;font-size:17px}
.L4 .it .p{font-weight:500;color:var(--fg)}
.L4 .it small{grid-column:1/-1;color:var(--mut);font-size:14px}
.L4 .foot{padding:40px 28px 50px;border-top:1px solid var(--ln);display:grid;gap:6px;font-size:15px;max-width:980px;margin:0 auto}
.L4 .foot h2{font-size:24px;margin-bottom:8px}

/* L5 : façon appli */
.L5 .hd{position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.L5 .logo{font-family:var(--fd);font-size:25px;font-weight:var(--fw)}
.L5 .pill{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--sf);color:var(--sfg);font-weight:600}
.L5 .heroc{margin:6px 18px 18px;border-radius:calc(var(--r) * 1.6);background:var(--ac);color:var(--on);padding:22px;display:flex;gap:10px;align-items:center;min-height:176px;overflow:hidden}
.L5 .heroc h1{font-size:31px;line-height:1.08}
.L5 .heroc p{margin-top:8px;font-size:14px;opacity:.9}
.L5 .heroc .em{font-size:92px;margin-left:auto;flex:none}
.L5 .chips{display:flex;gap:8px;padding:0 18px 4px;overflow:auto;scrollbar-width:none}
.L5 .chip{padding:9px 15px;border-radius:999px;background:var(--sf);color:var(--sfg);font-weight:600;font-size:14px;white-space:nowrap}
.L5 .chip.on{background:var(--fg);color:var(--bg)}
.L5 h3{font-size:21px;padding:20px 18px 10px}
.L5 .it{display:flex;gap:12px;align-items:center;margin:0 18px 10px;padding:10px;border-radius:calc(var(--r) * 1.2);background:var(--sf);color:var(--sfg)}
.L5 .it .em{width:72px;height:72px;flex:none;border-radius:var(--r);background:var(--ac2);font-size:38px}
.L5 .it b{display:block;font-size:15px;line-height:1.25}
.L5 .it small{display:block;font-size:12.5px;color:var(--mut);line-height:1.35;margin:2px 0 4px}
.L5 .plus{margin-left:auto;width:34px;height:34px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:22px;flex:none;line-height:1}
.L5 .infoc{margin:20px 18px 10px;padding:18px;border-radius:calc(var(--r) * 1.2);background:var(--sf);color:var(--sfg);display:grid;gap:8px;font-size:15px}
.L5 .infoc h2{font-size:22px;margin-bottom:4px}
.L5 .sb{position:sticky;bottom:0;padding:16px 18px 18px;background:linear-gradient(to bottom,transparent,var(--bg) 35%)}
.L5 .sb .btn{width:100%;min-height:52px;font-size:16px}

/* L6 : magazine */
.L6 .mast{padding:22px 22px 0;max-width:980px;margin:0 auto}
.L6 .mast h1{font-size:clamp(88px,27vw,210px);line-height:.85;letter-spacing:-.03em}
.L6 .meta{display:flex;justify-content:space-between;gap:10px;border-top:2px solid var(--fg);margin-top:10px;padding:8px 0;font-size:13px}
.L6 .feat{margin:16px 22px;background:var(--ac);color:var(--on);border-radius:var(--r);padding:26px 22px;display:grid;gap:14px}
.L6 .feat .col{font-size:60px;display:flex;gap:8px;line-height:1}
.L6 .feat h2{font-size:36px}
.L6 .feat p{opacity:.92}
.L6 .rows{padding:10px 22px 30px;max-width:980px;margin:0 auto}
.L6 .rows h2{font-size:44px;margin:22px 0 4px}
.L6 .rw{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.L6 .rw.alt{grid-template-columns:1fr 96px}
.L6 .rw.alt .em{order:2}
.L6 .rw .em{width:96px;height:96px;border-radius:var(--r);background:var(--sf);font-size:50px}
.L6 .rw h3{font-size:25px;line-height:1.1}
.L6 .rw small{display:block;color:var(--mut);font-size:14px;margin:4px 0}
.L6 .note{padding:30px 22px 40px;background:var(--sf);color:var(--sfg)}
.L6 .note > div{max-width:980px;margin:0 auto;display:grid;gap:6px}
.L6 .note h2{font-size:32px;margin-bottom:8px}
.L6 .note .btn{justify-self:start;margin-top:12px}

/* titres de groupe */
.gt{grid-column:1/-1;margin:14px 0 -2px;font-size:20px;font-weight:600}
.gt span{display:block;font-size:14px;font-weight:400;color:var(--cmut);margin-top:2px}

/* L7 : gastronomique, chandelles */

const $ = id => document.getElementById(id);
const fav = new Set();
let chosen = null, filter = "all", ovList = [], cur = 0;

function siteHTML(t){
  const st = Object.entries(t.v).map(([k,val]) => `--${k}:${val}`).join(";");
  return `<div class="site L${t.L} ${t.f||""}" style="${st}">${R[t.L]()}</div>`;
}
function list(){ return filter === "fav" ? T.filter(t => fav.has(t.id)) : T; }
const heartSVG = `<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>`;

function renderGrid(){
  const L = list();
  $("fFav").textContent = `Favoris (${fav.size})`;
  if (!L.length){
    $("grid").innerHTML = `<div class="empty">Pas encore de favori.<br>Touchez le cœur sous un style pour le garder ici.</div>`;
    return;
  }
  const HEAD = {etoile:["Ambiance restaurant","Chic, chaleureux, pour donner envie de réserver"], sakura:["Ambiance snack et street food","Moderne, coloré, pour commander vite"]};
  $("grid").innerHTML = L.map(t => (filter==="all" && HEAD[t.id] ? `<h2 class="gt">${HEAD[t.id][0]}<span>${HEAD[t.id][1]}</span></h2>` : "") + `
    <article class="card${chosen===t.id?" chosen":""}">
      <div class="th" role="button" tabindex="0" data-open="${t.id}" aria-label="Voir le style ${t.n}">
        <div class="ti" aria-hidden="true">${siteHTML(t)}</div>
        ${chosen===t.id?`<span class="badge">Choisi</span>`:""}
      </div>
      <div class="cf"><div><b>${t.n}</b><span>${t.d}</span></div>
        <button type="button" class="heart" data-fav="${t.id}" aria-pressed="${fav.has(t.id)}" aria-label="${fav.has(t.id)?"Retirer des favoris":"Ajouter aux favoris"} : ${t.n}">${heartSVG}</button>
      </div>
    </article>`).join("");
  scaleThumbs();
}
function scaleThumbs(){
  document.querySelectorAll(".th").forEach(b => { b.firstElementChild.style.transform = `scale(${b.clientWidth/390})`; });
}
new ResizeObserver(scaleThumbs).observe($("grid"));

function renderPicked(){
  const t = T.find(x => x.id === chosen);
  $("picked").classList.toggle("on", !!t);
  if (t) $("pickedName").textContent = t.n;
}

function openStyle(id){
  ovList = list().length ? list() : T;
  cur = Math.max(0, ovList.findIndex(t => t.id === id));
  $("ov").classList.add("on");
  document.body.style.overflow = "hidden";
  renderOv();
  $("ov").focus();
}
function renderOv(){
  const t = ovList[cur];
  $("ovBody").innerHTML = siteHTML(t);
  $("ovBody").scrollTop = 0;
  $("ovName").textContent = t.n;
  $("ovCount").textContent = `${cur+1} sur ${ovList.length}`;
  $("ovHeart").setAttribute("aria-pressed", fav.has(t.id));
  $("ovHeart").setAttribute("aria-label", fav.has(t.id) ? "Retirer des favoris" : "Ajouter aux favoris");
  const p = $("ovPick");
  p.textContent = chosen === t.id ? "Style choisi ✓" : "Choisir ce style";
  p.classList.toggle("done", chosen === t.id);
}
function closeOv(){
  $("ov").classList.remove("on");
  document.body.style.overflow = "";
  renderGrid();
}
function nav(d){ cur = (cur + d + ovList.length) % ovList.length; renderOv(); }
function toggleFav(id){ fav.has(id) ? fav.delete(id) : fav.add(id); }
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("on");
  clearTimeout(toast.k); toast.k = setTimeout(() => el.classList.remove("on"), 1600);
}

document.addEventListener("click", e => {
  if (e.target.closest(".site a")) e.preventDefault();
  const o = e.target.closest("[data-open]"); if (o) return openStyle(o.dataset.open);
  const f = e.target.closest("[data-fav]");
  if (f){ toggleFav(f.dataset.fav); renderGrid(); toast(fav.has(f.dataset.fav) ? "Ajouté aux favoris" : "Retiré des favoris"); }
});
$("grid").addEventListener("keydown", e => {
  const o = e.target.closest("[data-open]");
  if (o && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openStyle(o.dataset.open); }
});
$("fAll").onclick = () => { filter = "all"; $("fAll").setAttribute("aria-pressed","true"); $("fFav").setAttribute("aria-pressed","false"); renderGrid(); };
$("fFav").onclick = () => { filter = "fav"; $("fFav").setAttribute("aria-pressed","true"); $("fAll").setAttribute("aria-pressed","false"); renderGrid(); };
$("pickedOpen").onclick = () => { filter = "all"; $("fAll").click(); openStyle(chosen); };
$("ovClose").onclick = closeOv;
$("ovPrev").onclick = () => nav(-1);
$("ovNext").onclick = () => nav(1);
$("ovHeart").onclick = () => { const t = ovList[cur]; toggleFav(t.id); renderOv(); toast(fav.has(t.id) ? "Ajouté aux favoris" : "Retiré des favoris"); };
$("ovPick").onclick = () => {
  const t = ovList[cur];
  chosen = chosen === t.id ? null : t.id;
  renderOv(); renderPicked();
  toast(chosen ? `Style choisi : ${t.n}` : "Choix annulé");
};
document.addEventListener("keydown", e => {
  if (!$("ov").classList.contains("on")) return;
  if (e.key === "Escape") closeOv();
  if (e.key === "ArrowLeft") nav(-1);
  if (e.key === "ArrowRight") nav(1);
});
let sx = 0, sy = 0;
$("ovBody").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("ovBody").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45) nav(dx < 0 ? 1 : -1);
}, {passive:true});

renderGrid();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(scaleThumbs);
</script>
